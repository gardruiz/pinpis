[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinpis"
version = "0.1.0"
description = "Pipeline for coding-sequence reconstruction and piN/piS or dN/dS estimation from VCF data."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Daniel Ruiz" }
]
dependencies = [
    "biopython>=1.80",
    "pandas>=1.5",
    "pyyaml>=6.0",
]

[project.scripts]
pinpis = "pinpis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
